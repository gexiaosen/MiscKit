name: Release

# 推 tag 即全自动出包发布：
#   git tag v0.9.74 && git push --tags
# 链路：tag↔plist 校验 → build 递增校验 → 密钥扫描 → 单测 → ad-hoc 出包 → dmg
#      → EdDSA 签名（secrets 私钥）→ 建 Release → 生成 appcast 回传。
# 全程不需要任何 Apple 证书：Sparkle 2 走 EdDSA 通道，ad-hoc 签名包可正常自动更新。
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  SPARKLE_VERSION: '2.10.1'
  SPARKLE_DIST: 'https://github.com/sparkle-project/Sparkle/releases/download'

jobs:
  release:
    name: Package & Publish (macOS arm64)
    # Package.swift 声明 swift-tools-version 6.2，需要 Xcode 27（Swift 6.2）工具链；
    # macos-26 镜像最高 Xcode 26.6（Swift 6.1）会在包清单解析时直接失败。
    # xcode-27 镜像目前是 preview，与本地开发环境（Xcode 27.2）一致。
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 发布纪律：tag 与 Info.plist 必须严格同步，否则 Sparkle 客户端的
      # 版本比较就失去了事实来源；build 号是 Sparkle 的排序键，必须纯数字。
      - name: Verify tag matches Info.plist
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PLIST_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          BUILD="$(plutil -extract CFBundleVersion raw -o - Resources/Info.plist)"
          [ "$VERSION" = "$PLIST_VERSION" ] || { echo "tag($VERSION) 与 Info.plist($PLIST_VERSION) 不一致，先同步再打 tag"; exit 1; }
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "CFBundleVersion 必须是纯数字: $BUILD"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      # Sparkle 按 CFBundleVersion 排序；不递增等于发了"旧版本"，客户端会拒绝更新。
      - name: Verify build number increments
        run: |
          set +e
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" -o /tmp/prev-appcast.xml 2>/dev/null
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "首个 Release，无历史 appcast，跳过递增校验"
            exit 0
          fi
          # appcast 里 sparkle:version 是元素（<sparkle:version>102</sparkle:version>），
          # 不是属性；旧模式只认 sparkle:version="..." 会取到空串，递增校验形同虚设。
          PREV_BUILD="$(sed -n -e 's/.*<sparkle:version>\([0-9]*\)<\/sparkle:version>.*/\1/p' \
                               -e 's/.*sparkle:version="\([0-9]*\)".*/\1/p' /tmp/prev-appcast.xml \
                          | sort -n | tail -1)"
          if [ -n "$PREV_BUILD" ] && [ "$BUILD" -le "$PREV_BUILD" ]; then
            echo "CFBundleVersion($BUILD) 必须大于上一版($PREV_BUILD)：bump 后重打 tag"
            exit 1
          fi

      - name: Secret scan self-test & repository scan
        run: |
          ./Scripts/scan-secrets.sh --selftest
          ./Scripts/scan-secrets.sh

      # 私钥只在 GitHub Secrets，公钥写死在 Info.plist。两者不配对时发出去的包
      # 会被所有客户端拒收，且要等用户升级时才暴露 —— 发版前先自检一次。
      - name: Verify EdDSA key pair
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_ED_KEY" ] || { echo "缺 secret: SPARKLE_PRIVATE_ED_KEY"; exit 1; }
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | tr -d '[:space:]' | base64 -D > "$TMP/key.bin"
          SIZE="$(stat -f%z "$TMP/key.bin")"
          if [ "$SIZE" -eq 64 ]; then
            # libsodium 64 字节密钥对：后 32 字节就是公钥
            tail -c 32 "$TMP/key.bin" | base64 | tr -d '\n' > "$TMP/pub.txt"
          elif [ "$SIZE" -eq 32 ]; then
            # 32 字节 seed：包一层 PKCS#8 交给系统 openssl 派生公钥
            # 16 字节 PKCS#8 前缀拆两段写：连成 32 位 hex 会命中密钥扫描的「长令牌」规则
            { printf '302e020100300506032b6570' | xxd -r -p; \
              printf '04220420' | xxd -r -p; \
              cat "$TMP/key.bin"; } > "$TMP/seed.der"
            openssl pkey -inform DER -in "$TMP/seed.der" -pubout -outform DER -out "$TMP/pub.der"
            tail -c 32 "$TMP/pub.der" | base64 | tr -d '\n' > "$TMP/pub.txt"
          else
            echo "未知 EdDSA 私钥长度：$SIZE 字节"; exit 1
          fi
          ACTUAL="$(cat "$TMP/pub.txt")"
          EXPECTED="$(plutil -extract SUPublicEDKey raw -o - Resources/Info.plist)"
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "EdDSA 密钥不配对：secret 派生公钥=$ACTUAL，Info.plist=$EXPECTED"; exit 1; }
          echo "EdDSA 密钥配对通过（$ACTUAL）"

      - name: Unit tests
        run: |
          set +e
          swift --version 2>&1 | head -2 | tee /tmp/test.log
          swift test --arch arm64 --scratch-path "${RUNNER_TEMP}/misckit-build" 2>&1 | tee -a /tmp/test.log
          RC="${PIPESTATUS[0]}"
          set -e
          if [ "$RC" -ne 0 ]; then
            # 失败摘要打成 annotation（匿名 API 可见），免登录定位。
            # Swift Testing 输出是「✘ Test ... failed after ... / recorded an issue / Expectation failed」，
            # 旧模式只认 XCTest 的 "Test Case ... failed" 与编译器 "error: "，
            # 会把唯一的失败行整条漏掉，annotation 于是永远为空。
            # 用 -A 12 带上下文（issue 详情含期望值/实际值），不只给一行孤零零的失败标题。
            grep -A 12 -E "✘|error: |Expectation failed|recorded an issue|Test Case .* failed|failed after" /tmp/test.log \
                | head -100 > /tmp/fail-summary.txt || true
            n=0
            while IFS= read -r line; do
              trimmed="$(printf '%s' "$line" | tr -d '\r' | cut -c1-240)"
              [ -z "$trimmed" ] && continue
              n=$((n + 1)); [ "$n" -gt 14 ] && break
              echo "::error title=TestFail-${n}::${trimmed}"
            done < /tmp/fail-summary.txt
            exit 1
          fi

      # 签名身份决定系统认不认得出"还是那个 MiscKit"：
      #   · ad-hoc 的 designated requirement 就是 cdhash，版本号写在 Info.plist 里、
      #     被 CodeDirectory 哈希覆盖 ⇒ 每发一版身份必变 ⇒ 文件夹权限（TCC）与钥匙串
      #     ACL 的记录全部作废，用户重装一次就要重点一遍「桌面/文稿/下载」。
      #   · 固定证书的 requirement 是 `identifier + anchor apple generic + leaf CN`，
      #     与 cdhash 无关，一次授权跨版本有效。
      # secret 缺失时**不失败**（首次配置前仍能发版），只告警并退回 ad-hoc；
      # 配了就必须真的签上，签不上要炸——静默退回 ad-hoc 正是这个问题反复复发的原因。
      - name: Prepare signing identity
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.MISCKIT_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MISCKIT_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64}" ]; then
            echo "::warning title=未配置签名证书::回退 ad-hoc —— 重装后文件夹权限与钥匙串授权会重新询问。见 Scripts/export-signing-cert.sh"
            exit 0
          fi
          if [ -z "${CERT_PASSWORD}" ]; then
            echo "::error title=缺 CERT 密码::已有 MISCKIT_SIGNING_CERT_P12 却没有 MISCKIT_SIGNING_CERT_PASSWORD"
            exit 1
          fi
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="${RUNNER_TEMP}/signing.p12"
          printf '%s' "${CERT_P12_BASE64}" | tr -d '[:space:]' | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN}"
          # 只导入叶子证书时链是断的（CSSMERR_TP_NOT_TRUSTED），find-identity -v 会列空。
          # runner 一般自带，这里补一次兜底；装不上不影响（后面对身份有二次判定）。
          if curl -fsSL -o "${RUNNER_TEMP}/wwdr.cer" \
               https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer; then
            security add-certificates -k "${KEYCHAIN}" "${RUNNER_TEMP}/wwdr.cer" || true
          fi
          security import "${CERT_PATH}" -k "${KEYCHAIN}" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          # codesign 要免交互取私钥，必须先放开 partition list（macOS 10.12+ 必需）
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" \
            $(security list-keychains -d user | tr -d '"') 
          rm -f "${CERT_PATH}"
          # -v 只列"信任链完整"的身份；runner 上万一缺 WWDR 中间证书就会列空。
          # 退一步用不带 -v 的列表（codesign 本身不要求信任链，但 --verify --strict 会），
          # 同时把 CSSMERR 后缀去掉——它会让 codesign 认不出这个名字。
          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"
          if [ -z "${IDENTITY}" ]; then
            echo "::warning title=信任链不完整::find-identity -v 为空，多半是 runner 缺 AppleWWDRCA 中间证书"
            IDENTITY="$(security find-identity -p codesigning "${KEYCHAIN}" \
              | sed -n 's/.*"\(.*\)"/\1/p' | sed 's/ *(CSSMERR[^)]*)//' | head -1)"
          fi
          if [ -z "${IDENTITY}" ]; then
            echo "::error title=证书不可用::p12 导入成功但列不出可签名身份，检查 p12 是否含私钥"
            exit 1
          fi
          echo "签名身份: ${IDENTITY}"
          echo "MISCKIT_SIGN_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"

      - name: Package .app
        run: MISCKIT_SCRATCH="${RUNNER_TEMP}/misckit-build" ./Scripts/make-app.sh release

      # 签没签上是事实问题，不能靠"脚本没报错"推断：直接看包上的签名形态，
      # 期望证书签名却拿到 ad-hoc 就立刻失败，别把会重复弹权限的包发出去。
      - name: Verify signature identity
        run: |
          set -euo pipefail
          APP="${RUNNER_TEMP}/misckit-build/product/MiscKit.app"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E '^(Identifier|Signature|Authority|TeamIdentifier)' || true
          DR="$(codesign -dr- "$APP" 2>&1 | tail -1)"
          echo "DR: $DR"
          if [ -n "${MISCKIT_SIGN_IDENTITY:-}" ]; then
            echo "$DR" | grep -q 'anchor apple generic' || {
              echo "::error title=签名未生效::期望 ${MISCKIT_SIGN_IDENTITY}，实际 DR 仍是 cdhash"; exit 1; }
          else
            echo "::warning title=当前为 ad-hoc 包::重装后需要重新授权文件夹与钥匙串"
          fi

      - name: Cleanup signing keychain
        if: always()
        run: |
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          [ -e "$KEYCHAIN" ] || exit 0
          security delete-keychain "$KEYCHAIN" || true

      - name: Package .dmg
        run: |
          ./Scripts/make-dmg.sh \
            "${RUNNER_TEMP}/misckit-build/product/MiscKit.app" \
            "${RUNNER_TEMP}/misckit-build/product/MiscKit-v${VERSION}-arm64.dmg"

      # EdDSA 私钥只存在于 GitHub Secrets：泄露面仅限更新通道签名，
      # 与 Apple 证书无关。sign_update 输出的 edSignature+length 直接进 appcast。
      - name: Sign dmg with Sparkle EdDSA key
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_ED_KEY" ] || { echo "缺 secret: SPARKLE_PRIVATE_ED_KEY（generate_keys -x 导出后录入）"; exit 1; }
          curl -fsSL -o /tmp/sparkle.tar.xz "${SPARKLE_DIST}/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf /tmp/sparkle.tar.xz -C /tmp bin/sign_update
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          # Secrets 里可能带录入时的尾随换行，先去掉空白再交给 sign_update
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | tr -d '[:space:]' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          /tmp/bin/sign_update "${RUNNER_TEMP}/misckit-build/product/MiscKit-v${VERSION}-arm64.dmg" \
            -f "$KEY_FILE" > /tmp/sparkle-signature.txt
          cat /tmp/sparkle-signature.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release 正文统一取自 CHANGELOG.md 对应版本段落：首个版本写全功能，
          # 后续版本只追加变化。不再用 --generate-notes（只有 commit 列表）。
          ./Scripts/release-notes.sh "$VERSION" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/misckit-build/product/MiscKit-v${VERSION}-arm64.dmg" \
            --title "MiscKit ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest

      # appcast 的 SUFeedURL 指向 releases/latest/download/appcast.xml，
      # 每次发版覆盖同 asset 名，客户端永远拿到最新一条目。
      - name: Generate & upload appcast.xml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_NAME="MiscKit-v${VERSION}-arm64.dmg"
          DMG_PATH="${RUNNER_TEMP}/misckit-build/product/${DMG_NAME}"
          DMG_SIZE="$(stat -f%z "$DMG_PATH")"
          SIG="$(cat /tmp/sparkle-signature.txt)"
          # Sparkle 的 <description> 是按 HTML 渲染的：塞 Markdown 会让 `###`、`**`
          # 原样显示出来（1.0.1 首发的更新窗就是一坨字）。这里按 CHANGELOG 转 HTML，
          # 与 GitHub Release 正文（Markdown）同源不同格式，两边永远一致。
          python3 ./Scripts/changelog-to-html.py "$VERSION" > /tmp/appcast-notes.html
          python3 - "$VERSION" "$BUILD" "$GITHUB_REPOSITORY" "$DMG_NAME" "$DMG_SIZE" "$SIG" <<'PYEOF'
          import sys
          version, build, repo, dmg_name, dmg_size, sig = sys.argv[1:7]
          notes = open('/tmp/appcast-notes.html').read().replace(']]>', ']]&gt;')
          pub_date = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).strftime('%a, %d %b %Y %H:%M:%S +0000')
          appcast = f'''<?xml version="1.0" encoding="utf-8" standalone="no"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/" version="2.0">
            <channel>
              <title>MiscKit</title>
              <link>https://github.com/{repo}/releases/latest/download/appcast.xml</link>
              <description>Most recent changes</description>
              <language>en</language>
              <item>
                <title>MiscKit {version}</title>
                <pubDate>{pub_date}</pubDate>
                <sparkle:version>{build}</sparkle:version>
                <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="https://github.com/{repo}/releases/download/v{version}/{dmg_name}"
                  {sig}
                  type="application/x-apple-diskimage"
                />
                <description><![CDATA[{notes}]]></description>
              </item>
            </channel>
          </rss>
          '''
          with open('/tmp/appcast.xml', 'w') as f:
              f.write(appcast)
          PYEOF
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('/tmp/appcast.xml')" \
            && echo "appcast XML 校验通过"
          gh release upload "$GITHUB_REF_NAME" /tmp/appcast.xml --clobber
          echo "✅ 发布完成：Sparkle 客户端将于每日静默检查时发现 ${VERSION}"
