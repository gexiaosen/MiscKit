name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Build, Test & Secret Scan (macOS arm64)
    # Package.swift 需要 Swift 6.2（Xcode 27）；macos-26 镜像最高 Swift 6.1
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check architecture & Xcode
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Secret scan self-test & repository scan
        run: |
          ./Scripts/scan-secrets.sh --selftest
          ./Scripts/scan-secrets.sh

      - name: Run unit tests
        run: |
          set +e
          swift --version 2>&1 | head -2 | tee /tmp/test.log
          swift test --arch arm64 --scratch-path "${RUNNER_TEMP:-/tmp}/misckit-build" 2>&1 | tee -a /tmp/test.log
          RC="${PIPESTATUS[0]}"
          set -e
          if [ "$RC" -ne 0 ]; then
            # 与 Release workflow 对齐：Swift Testing 的失败行是
            # 「✘ Test ... recorded an issue ... Expectation failed」，旧模式只认 XCTest
            # 的 "Test Case ... failed" 会把唯一失败行漏掉，annotation 恒为空。
            { grep -E "error: |Expectation failed|recorded an issue|Test Case .* failed|failed \(" /tmp/test.log \
                | sort -u | head -20; } | while IFS= read -r line; do
              echo "::error title=UnitTestsFailed::${line}"
            done
            echo "===== 日志尾部 40 行 ====="
            tail -40 /tmp/test.log
            exit 1
          fi

      - name: Build Debug & Release
        run: |
          swift build -c debug --arch arm64 --scratch-path "${RUNNER_TEMP:-/tmp}/misckit-build"
          swift build -c release --arch arm64 --scratch-path "${RUNNER_TEMP:-/tmp}/misckit-build"

      - name: Package .app & verify signature and resource bundle
        run: |
          MISCKIT_SCRATCH="${RUNNER_TEMP:-/tmp}/misckit-build" ./Scripts/make-app.sh release
          APP="${RUNNER_TEMP:-/tmp}/misckit-build/product/MiscKit.app"
          codesign --verify --deep --strict "$APP"
          test -d "$APP/Contents/Resources/MiscKit_MiscKitCore.bundle"
